[package]
name = "antcolony"
version = "0.7.1"
edition = "2021"
description = "An ant colony that lives in a terminal pane"
license = "MIT"
homepage = "https://github.com/tom-xlsx/antcolony"
repository = "https://github.com/tom-xlsx/antcolony"

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
fastrand = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
