[package]
name = "antcolony"
version = "0.5.3"
edition = "2021"
description = "An ant colony that lives in a terminal pane"
license = "MIT"
repository = "https://github.com/tom-xlsx/antcolony"

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
fastrand = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
